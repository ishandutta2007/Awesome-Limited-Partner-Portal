<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shimmer & Pulse Animations for Dynamic Aspect -->
    <linearGradient id="shimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)">
        <animate attributeName="offset" values="-1; 2" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="rgba(56,189,248,0.4)">
        <animate attributeName="offset" values="-0.5; 2.5" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="rgba(255,255,255,0)">
        <animate attributeName="offset" values="0; 3" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Background Rect -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Tech Grid Lines -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Floating Dynamic Nodes / Pulsing Orbs -->
  <circle cx="1020" cy="100" r="140" fill="#818cf8" opacity="0.15" filter="url(#glow)">
    <animate attributeName="r" values="120;150;120" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="900" cy="240" r="90" fill="#38bdf8" opacity="0.2" filter="url(#glow)">
    <animate attributeName="r" values="80;105;80" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Decorative Circuit Graphic right side -->
  <g stroke="url(#accentGrad)" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 850 180 L 920 180 L 960 130 L 1080 130">
      <animate attributeName="stroke-dasharray" values="0,300;300,0" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M 880 220 L 940 220 L 980 260 L 1120 260">
      <animate attributeName="stroke-dasharray" values="0,300;300,0" dur="4s" repeatCount="indefinite" />
    </path>
    <circle cx="1080" cy="130" r="4" fill="#38bdf8" />
    <circle cx="1120" cy="260" r="4" fill="#c084fc" />
  </g>

  <!-- Header Badge -->
  <g transform="translate(80, 50)">
    <rect width="260" height="32" rx="16" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="130" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">AWESOME CURATED LIST</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="135" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Awesome LP Portal Infrastructure
  </text>

  <!-- Dynamic Gradient Accent Bar -->
  <rect x="80" y="152" width="680" height="4" rx="2" fill="url(#accentGrad)" />
  <rect x="80" y="152" width="680" height="4" rx="2" fill="url(#shimmer)" />

  <!-- Subtitle -->
  <text x="80" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">
    Institutional Limited Partner Portals, Fund Accounting &amp; Investor Relations Stack
  </text>

  <!-- Key Feature Pills -->
  <g transform="translate(80, 235)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#38bdf8" stroke-width="1.5" />
      <text x="90" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🏦 SaaS &amp; Enterprise</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="180" height="42" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#818cf8" stroke-width="1.5" />
      <text x="90" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🌍 Open-Source Stacks</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(390, 0)">
      <rect width="180" height="42" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#c084fc" stroke-width="1.5" />
      <text x="90" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">📊 Fund Accounting</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(585, 0)">
      <rect width="180" height="42" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#f472b6" stroke-width="1.5" />
      <text x="90" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🤖 AI LP Reporting</text>
    </g>
  </g>

  <!-- Live Pulse Dot Bottom Right -->
  <g transform="translate(1120, 320)">
    <circle cx="0" cy="0" r="8" fill="#34d399" filter="url(#subtleGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>
</svg>
